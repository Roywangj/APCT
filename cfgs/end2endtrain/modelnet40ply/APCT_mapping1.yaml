optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset:
  train:
    _base_: cfgs/dataset_configs/ModelNet40ply.yaml
    others:
      subset: 'train'
#      num_points: 1024
  val:
    _base_: cfgs/dataset_configs/ModelNet40ply.yaml
    others:
      subset: 'test'
      num_points: 1024
  test:
    _base_: cfgs/dataset_configs/ModelNet40ply.yaml
    others:
      subset: 'test'
      num_points: 1024

# attn_drop_rates: 0.0
model : {
  NAME: APCT_mapping1,
  encoder_depths: [ 4, 4, 4],
  encoder_dims: [ 384, 384, 384],
  attn_drop_rates: [0.0, 0.0, 0.0], # not used in raw
  use_DropKeys: [true, false, false],
  trans_dim: 384,
  drop_path_rate: 0.1,
  cls_dim: 40,
  num_heads: 6,
  group_size: 32,
  num_group: 64,
  mean_prob_values: [0.2, 0.2, 0.2],
  lower_bound: 0.05,
  upper_bound: 0.95,
}


npoints: 1024 # 2048
total_bs : 32
step_per_update : 1
max_epoch : 300
grad_norm_clip : 10

mode: modelnetc3preds_1    # modelnetc
base_loss_ratio: 1.0
drop_loss_ratio: 1.0
all_loss_ratio: 1.0